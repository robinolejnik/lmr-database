services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: lmr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-lmr}
      POSTGRES_USER: ${PG_USER:-lmr}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lmr}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=2GB
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lmr} -d ${PG_DB:-lmr}"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgraphile:
    build: ./apps/postgraphile
    container_name: lmr-postgraphile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Host networking is required to reach Keycloak at auth.commsplice.com:
    # that host is only routable via IPv6, and the default docker bridge has
    # no IPv6. Sharing the host's network stack gives us its IPv6 too.
    # Side-effects: no `ports:` block, postgres is reached via host loopback,
    # the server binds to 127.0.0.1 directly (see apps/postgraphile/server.mjs).
    network_mode: host
    environment:
      DATABASE_URL: postgres://${PG_USER:-lmr}:${PG_PASSWORD:-lmr}@127.0.0.1:${PG_PORT:-5432}/${PG_DB:-lmr}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      PORT: ${PGRAPHILE_PORT:-5050}
    # Mount the config + server entry as volumes so edits are picked up on
    # `docker restart lmr-postgraphile` — no rebuild needed for code changes.
    # node_modules stays inside the image.
    volumes:
      - ./apps/postgraphile/graphile.config.mjs:/app/graphile.config.mjs:ro
      - ./apps/postgraphile/server.mjs:/app/server.mjs:ro

volumes:
  pgdata:
    name: lmr-pgdata
