services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: lmr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-lmr}
      POSTGRES_USER: ${PG_USER:-lmr}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lmr}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=2GB
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lmr} -d ${PG_DB:-lmr}"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgraphile:
    build: ./apps/postgraphile
    container_name: lmr-postgraphile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to localhost only — VSCode Remote auto-forwards the port from the
    # linux dev box to the developer's workstation. No LAN exposure.
    ports:
      - "127.0.0.1:${PGRAPHILE_PORT:-5050}:5050"
    environment:
      DATABASE_URL: postgres://${PG_USER:-lmr}:${PG_PASSWORD:-lmr}@postgres:5432/${PG_DB:-lmr}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
    # Mount the config + server entry as volumes so edits are picked up on
    # `docker restart lmr-postgraphile` — no rebuild needed for code changes.
    # node_modules stays inside the image.
    volumes:
      - ./apps/postgraphile/graphile.config.mjs:/app/graphile.config.mjs:ro
      - ./apps/postgraphile/server.mjs:/app/server.mjs:ro

volumes:
  pgdata:
    name: lmr-pgdata
